name: Temporary finalize accepted 4.2.1 rules

on:
  push:
    branches: [fix/playlist-link-gmmp-4.2.1]
    paths:
      - .github/workflows/tmp-finalize-agents.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct stale acceptance wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('AGENTS.md')
          s = p.read_text(encoding='utf-8')
          old1 = 'Preserve queue IDs, Track IDs and Current state; do not reselect recommendations, replay playback or infer an append allocator. Device re-acceptance remains required.'
          new1 = 'Preserve queue IDs, Track IDs and Current state; do not reselect recommendations, replay playback or infer an append allocator. Device re-acceptance completed successfully as part of the final 4.2.1 acceptance on 2026-10-17.'
          old2 = '- r45 carries one bounded read-only mapping observer for GMMP 4.2.1\'s unique declared `MenuItem,List -> boolean` context-action boundary (`ex3.r` on the tested build). It is request-local, observes only native Play, does not mutate arguments, and is intended to determine whether this pre-materialization boundary can replace the lost 4.2.0 queue-owner transaction. Retire it after one conclusive device trace.'
          new2 = '- The former r45 bounded read-only `MenuItem,List -> boolean` context-action observer was diagnostic only and is retired/removed after the conclusive 4.2.1 device work. Do not restore that probe on an accepted runtime; a future unknown GMMP version may reintroduce a bounded read-only probe only if the native boundary becomes unresolved again.'
          for old, new in ((old1, new1), (old2, new2)):
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one stale rule, found {s.count(old)}: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git diff -- AGENTS.md
          test "$(git diff --name-only | sort)" = "AGENTS.md"
      - name: Commit rule cleanup and remove helper
        run: |
          rm .github/workflows/tmp-finalize-agents.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(compat): close final 4.2.1 acceptance notes"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
