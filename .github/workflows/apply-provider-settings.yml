name: Apply provider settings patch

on:
  push:
    paths:
      - '.github/workflows/apply-provider-settings.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/feature/auto-dj-providers'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded source patch
        run: python3 scripts/apply_provider_settings_patch.py

      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned smoke test)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Remove one-off helper files
        run: |
          rm -f scripts/apply_provider_settings_patch.py
          rm -f .github/workflows/apply-provider-settings.yml

      - name: Commit implementation
        run: |
          git config user.name "alagga"
          git config user.email "69852271+alagga@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(auto-dj): add smart provider controls and parallel sources"
          git push origin HEAD:${GITHUB_REF_NAME}
