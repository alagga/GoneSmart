name: R66 Patch

on:
  push:
    branches: [fix/playlist-link-gmmp-4.2.1]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'ci: run r66 writer validation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply R66 patch
        run: python3 scripts/tmp_r66_patch.py
      - name: Verify R66 scope
        run: |
          git diff --check
          git status --short
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            AGENTS.md \
            app/src/main/java/io/github/alagga/gonesmart/NativeQueuePositionWriterObserver.kt \
            app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt \
            app/src/main/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicy.kt \
            app/src/test/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicyTest.kt \
            docs/GMMP_COMPATIBILITY_PLAYBOOK.md | sort)
          test "$changed" = "$expected"
          ! grep -R "WRITE_TIMEOUT_MS" -n app/src/main/java/io/github/alagga/gonesmart/NativeQueuePositionWriterObserver.kt
          grep -q "WRITE_DISPATCH_TIMEOUT_MS = 4_000L" app/src/main/java/io/github/alagga/gonesmart/NativeQueuePositionWriterObserver.kt
          grep -q "route=suppressed-prepared" app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit validated R66 patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-r66.yml scripts/tmp_r66_patch.py
          git add AGENTS.md \
            app/src/main/java/io/github/alagga/gonesmart/NativeQueuePositionWriterObserver.kt \
            app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt \
            app/src/main/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicy.kt \
            app/src/test/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicyTest.kt \
            docs/GMMP_COMPATIBILITY_PLAYBOOK.md
          git commit -m "fix(track-mix): tolerate queued current writer"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
