name: RC Audit Snapshot

on:
  push:
    branches: ['release/0.5.0-rc.1']
    paths: ['.github/workflows/rc-integration-helper.yml']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout combined RC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check

      - name: Basic merge hygiene
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git grep -n -E '^(<<<<<<< |>>>>>>> )' -- . ':!docs/forum/*' || true)" || {
            echo "Conflict markers found" >&2
            git grep -n -E '^(<<<<<<< |>>>>>>> )' -- . ':!docs/forum/*' >&2 || true
            exit 1
          }
          git diff --check
          git status --short

      - name: Capture audit inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-meta
          git rev-parse HEAD > audit-meta/head.txt
          git log -1 --format='%H%n%P%n%s' > audit-meta/commit.txt
          git ls-files > audit-meta/files.txt
          git grep -n -E 'TODO|FIXME|HACK|TEMPORARY|temporary probe|debug-only' -- '*.kt' '*.java' '*.md' > audit-meta/todos-and-temporary.txt || true
          git grep -n -E 'getDeclared(Field|Method)|declaredFields|declaredMethods|Class\.forName|XposedHelpers|hook\(' -- 'app/src/main/**/*.kt' > audit-meta/reflection-and-hooks.txt || true
          git grep -n -E 'Log\.(v|d|i|w|e)\(' -- 'app/src/main/**/*.kt' > audit-meta/log-sites.txt || true

      - name: Upload combined source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: GoneSmart-0.5.0-rc.1-audit-source
          path: |
            AGENTS.md
            README.md
            RELEASE_NOTES.md
            app/build.gradle.kts
            app/src
            docs
            scripts
            .github/workflows
            audit-meta
          retention-days: 1
