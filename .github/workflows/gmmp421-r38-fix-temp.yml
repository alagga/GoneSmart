name: GMMP 4.2.1 r38 repair temp

on:
  push:
    paths:
      - 'scripts/gmmp421_r38_fix_temp.py'
      - '.github/workflows/gmmp421-r38-fix-temp.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply r38 repair
        run: python3 scripts/gmmp421_r38_fix_temp.py
      - name: Run unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Commit repair and remove helpers
        run: |
          rm scripts/gmmp421_r38_fix_temp.py
          rm .github/workflows/gmmp421-r38-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: retain Track Mix Auto-DJ owner across state hooks'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
