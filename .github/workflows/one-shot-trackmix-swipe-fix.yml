name: One-shot track mix and swipe fix

on:
  push:
    branches: [tmp-trackmix-swipe-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-trackmix-swipe-fix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Apply runtime fixes
        run: python3 .github/tmp_trackmix_swipe_fix.py

      - name: Check diff
        run: |
          git diff --check
          git diff --stat
          if grep -n "TimeUnit" app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt; then exit 1; fi
          if grep -n 'nativeAutoDj?.get()?.let { field(it, "q") }' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt; then exit 1; fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit patch and remove temporary infrastructure
        run: |
          rm -f .github/workflows/one-shot-trackmix-swipe-fix.yml .github/tmp_trackmix_swipe_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): repair track mix and stop swipe scans"
          git push origin HEAD:tmp-trackmix-swipe-fix
