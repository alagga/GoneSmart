name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Debug APKs are installed for real recommendation-provider device tests.
      # Without this the Last.fm provider was silently inert in CI artifacts.
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Require Last.fm in maintainer test APKs
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$LASTFM_API_KEY" ]; then
            echo "::error::LASTFM_API_KEY repository secret is missing; debug APK would have no Last.fm provider"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned smoke test)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoneSmart-debug
          path: app/build/outputs/apk/debug/app-debug.apk
