name: One-shot Queue Flip observer wiring

on:
  push:
    branches: [feature/playlist-bridge]
    paths:
      - '.github/workflows/one-shot-wire-queue-position-observer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge

      - name: Wire passive position observer
        run: |
          python .github/scripts/wire_queue_position_observer.py
          git diff --check
          git diff -- app/src/main/java/io/github/alagga/gonesmart/GoneSmartModule.kt

      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/alagga/gonesmart/GoneSmartModule.kt
          git commit -m 'fix(queue-flip): observe native position writer passively'
          git push origin HEAD:feature/playlist-bridge
