name: Temporary GMMP 4.2.1 r28 repair

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']
    paths: ['.github/workflows/gmmp421-r28-fix-temp.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 2

      - name: Recover and apply r28 patch script
        shell: bash
        run: |
          git show HEAD^:.github/workflows/gmmp421-r28-fix-temp.yml > /tmp/previous-helper.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/previous-helper.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = []
          for line in lines[start:end]:
              script.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-r28.py').write_text('\n'.join(script) + '\n')
          PY
          python3 /tmp/apply-r28.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate repair
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit repair and remove helper
        shell: bash
        run: |
          git rm .github/workflows/gmmp421-r28-fix-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent Track Mix null source and restore link chooser"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
