name: One-shot runtime performance audit cleanup

on:
  push:
    branches:
      - feature/playlist-bridge
    paths:
      - tools/runtime_perf_audit_patch.py
      - .github/workflows/runtime-perf-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0
      - name: Apply bounded runtime performance cleanup
        run: python3 tools/runtime_perf_audit_patch.py
      - name: Check diff
        run: git diff --check
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/io/github/alagga/gonesmart/PlaylistNavigationBadgeController.kt \
            app/src/main/java/io/github/alagga/gonesmart/QueueFlipController.kt
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "perf(runtime): retire repeated UI scans and flip polling"
          git push origin HEAD:feature/playlist-bridge
