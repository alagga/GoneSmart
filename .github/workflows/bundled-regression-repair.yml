name: Bundled regression repair

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: run bundled regression repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Apply exact bundled repair
        run: python3 scripts/bundled_regression_repair.py
      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Build release APK smoke test
        run: ./gradlew assembleRelease
      - name: Commit repair and remove helper files
        run: |
          rm .github/workflows/bundled-regression-repair.yml scripts/bundled_regression_repair.py
          git config user.name "GoneSmart repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair Track Mix continuity and Playlist Link discovery"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
