name: Apply Playlist Link 4.2.1 repair (one-time)

on:
  push:
    branches: [fix/playlist-link-gmmp-4.2.1]
    paths:
      - '.github/workflows/apply-playlist-link-421.yml'

permissions:
  contents: write

env:
  BRANCH_NAME: fix/playlist-link-gmmp-4.2.1

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0

      - name: Tighten patch context
        run: python3 scripts/fix_apply_playlist_link_421.py

      - name: Apply repair
        run: python3 scripts/apply_playlist_link_421.py

      - name: Diff hygiene
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Remove one-time helpers and commit repaired tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_playlist_link_421.py scripts/fix_apply_playlist_link_421.py .github/workflows/apply-playlist-link-421.yml
          git add AGENTS.md docs app/src
          git diff --cached --check
          git commit -m "fix(playlist-link): restore GMMP 4.2.1 runtime bindings"
          git push origin HEAD:${BRANCH_NAME}
