name: One-shot runtime latency fixes

on:
  push:
    branches: [tmp-trackmix-swipe-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-trackmix-swipe-fix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Apply runtime fixes
        run: |
          python3 .github/tmp_prepare_agents.py
          python3 .github/tmp_trackmix_swipe_fix_v2.py
          python3 .github/tmp_harden_legacy_trackmix.py
          python3 .github/tmp_smartdj_latency_fix.py

      - name: Check diff
        run: |
          git diff --check
          git diff --stat
          if grep -n "TimeUnit" app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt; then exit 1; fi
          if grep -n 'nativeAutoDj?.get()?.let { field(it, "q") }' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt | grep -v 'takeIf'; then
            python3 - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt').read_text()
          bad='nativeAutoDj?.get()?.let { field(it, "q") }\n            ?: '
          raise SystemExit(1 if bad in s else 0)
          PY
          fi
          if grep -R "markRefillAttempt" -n app/src/main/java/io/github/alagga/gonesmart; then exit 1; fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit patch and remove temporary infrastructure
        run: |
          rm -f .github/workflows/one-shot-trackmix-swipe-fix.yml \
            .github/tmp_trackmix_swipe_fix.py \
            .github/tmp_trackmix_swipe_fix_v2.py \
            .github/tmp_prepare_agents.py \
            .github/tmp_harden_legacy_trackmix.py \
            .github/tmp_smartdj_latency_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): remove playback and pager latency regressions"
          git push origin HEAD:tmp-trackmix-swipe-fix
