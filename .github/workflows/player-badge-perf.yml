name: One-shot player badge performance cleanup

on:
  push:
    branches:
      - feature/playlist-bridge
    paths:
      - tools/player_badge_perf_patch.py
      - .github/workflows/player-badge-perf.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0
      - name: Apply bounded player badge cleanup
        run: python3 tools/player_badge_perf_patch.py
      - name: Check diff
        run: git diff --check
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/alagga/gonesmart/PlayerAutoDjBadgeController.kt
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "perf(player): cache badge discovery and glyph rendering"
          git push origin HEAD:feature/playlist-bridge
