name: Temporary r45 reacceptance pin

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']
    paths:
      - 'scripts/tmp_r45_pin_docs.py'
      - '.github/workflows/tmp-r45-pin-docs.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0
      - name: Apply r45 reacceptance pin
        run: python3 scripts/tmp_r45_pin_docs.py
      - name: Guard pinned criteria
        run: |
          grep -n "current \*\*r45\*\*" docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          grep -n "gmmp421-r45" docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          grep -n "6ea2c00f649a524ae0132da1fbe77470d5737815" docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          grep -n "native Play not dispatched" docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          git diff --check
      - name: Commit docs and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp_r45_pin_docs.py .github/workflows/tmp-r45-pin-docs.yml
          git add docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          git commit -m "docs: pin GMMP 4.2.1 r45 re-acceptance"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
