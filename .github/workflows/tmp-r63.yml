name: R63 Patch

on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/tmp_r63_patch.py

      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' AGENTS.md app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt app/src/main/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicy.kt app/src/test/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicyTest.kt docs/GMMP_COMPATIBILITY_PLAYBOOK.md | sort)"
          grep -q 'MIX PREPLAY PREPARED SEED | isolated=true' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q 'requiresPreparedSeedIsolation' app/src/main/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicy.kt
          grep -q 'R63 device evidence' AGENTS.md
          grep -q 'R63 prepared Queue seed isolation' docs/GMMP_COMPATIBILITY_PLAYBOOK.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Commit validated patch
        run: |
          rm .github/workflows/tmp-r63.yml scripts/tmp_r63_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(track-mix): isolate prepared queue seed"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
