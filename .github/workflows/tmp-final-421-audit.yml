name: Temporary final 4.2.1 audit

on:
  push:
    branches: [fix/playlist-link-gmmp-4.2.1]

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final audit patch
        run: python3 scripts/tmp_final_421_audit.py

      - name: Verify final audit scope
        run: |
          git diff --check
          git status --short
          test "$(grep -R "observeNativeContextPlayBoundary" -n app/src/main/java/io/github/alagga/gonesmart || true)" = ""
          test "$(grep -R "narrowNativePlaybackListForZeroPool" -n app/src/main/java/io/github/alagga/gonesmart || true)" = ""
          grep -q 'GMMP_421_SONG_VISIBLE_ITEMS = setOf(9, 10)' app/src/main/java/io/github/alagga/gonesmart/TrackMixFileBrowserMenuResolver.kt
          grep -q 'GMMP_421_DIRECTORY_VISIBLE_ITEMS = 8' app/src/main/java/io/github/alagga/gonesmart/TrackMixFileBrowserMenuResolver.kt
          grep -q 'listOf(0, 7, 11, 12)' app/src/test/java/io/github/alagga/gonesmart/TrackMixFileBrowserMenuResolverTest.kt

      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK smoke test
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Commit validated final audit
        run: |
          rm .github/workflows/tmp-final-421-audit.yml scripts/tmp_final_421_audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(compat): finalize GMMP 4.2.1 audit"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
