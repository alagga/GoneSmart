name: RC Integration Helper

on:
  push:
    branches: ['release/0.5.0-rc.1']
    paths: ['.github/workflows/rc-integration-helper.yml']

permissions:
  contents: write

jobs:
  merge-auto-dj:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Auto-DJ providers with audited resolutions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GoneSmart RC integration"
          git config user.email "69852271+alagga@users.noreply.github.com"
          git fetch origin feature/auto-dj-providers:refs/remotes/origin/feature/auto-dj-providers
          git merge --no-commit --no-ff origin/feature/auto-dj-providers || true

          python3 - <<'PY'
          from pathlib import Path
          import re

          marker = re.compile(
              r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> origin/feature/auto-dj-providers\n?',
              re.S,
          )

          def resolve(path, resolver):
              p = Path(path)
              text = p.read_text()
              if not marker.search(text):
                  raise SystemExit(f"Expected merge conflicts in {path}")
              index = 0
              def repl(match):
                  nonlocal index
                  ours, theirs = match.group(1), match.group(2)
                  value = resolver(index, ours, theirs)
                  index += 1
                  return value.rstrip() + "\n"
              resolved = marker.sub(repl, text)
              if '<<<<<<<' in resolved or '>>>>>>>' in resolved:
                  raise SystemExit(f"Conflict marker remains in {path}")
              p.write_text(resolved)

          def library_resolver(index, ours, theirs):
              if index == 0:
                  return ours.rstrip() + "\n\n" + theirs.rstrip()
              if index == 1:
                  return '''                val cachedAt = SystemClock.elapsedRealtime()
                cacheCreatedAtElapsedMs = cachedAt
                cacheValidatedAtElapsedMs = cachedAt
                cachedRevision =
                    readLibraryRevision(autoDjInstance)
                        ?: revisionFromTracks(loaded)

                Log.i(
                    TAG,
                    "GMMP library path index ready | tracks=${pathIndex.trackCount} | " +
                        "paths=${pathIndex.idsByPath.size} | " +
                        "ambiguous=${pathIndex.ambiguousPaths.size}"
                )'''
              if index == 2:
                  return ours.rstrip() + "\n\n" + theirs.rstrip()
              if index == 3:
                  return ours.rstrip()
              raise SystemExit(f"Unexpected GmmpLibraryReader conflict #{index}")

          resolve(
              'app/src/main/java/io/github/alagga/gonesmart/GmmpLibraryReader.kt',
              library_resolver,
          )

          def agents_resolver(index, ours, theirs):
              if index == 0:
                  build_identity = ours.split('\n\nBroad class/method/recycler inventories', 1)[0].rstrip()
                  return build_identity + "\n\n" + theirs.rstrip()
              if index == 1:
                  return ours.rstrip() + "\n\n" + theirs.rstrip()
              raise SystemExit(f"Unexpected AGENTS conflict #{index}")

          resolve('AGENTS.md', agents_resolver)
          resolve(
              'docs/GMMP_COMPATIBILITY_PLAYBOOK.md',
              lambda index, ours, theirs: ours.rstrip() + "\n\n" + theirs.rstrip(),
          )
          PY

          git checkout --ours docs/ROADMAP.md
          test -z "$(git diff --name-only --diff-filter=U)" || {
            echo "Unresolved merge conflicts remain:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          }
          if grep -R -n -E '^(<<<<<<<|>>>>>>>)' AGENTS.md app/src/main/java/io/github/alagga/gonesmart/GmmpLibraryReader.kt docs/GMMP_COMPATIBILITY_PLAYBOOK.md docs/ROADMAP.md; then
            echo "Conflict markers remain after resolution" >&2
            exit 1
          fi
          git diff --check
          git add AGENTS.md app/src/main/java/io/github/alagga/gonesmart/GmmpLibraryReader.kt docs/GMMP_COMPATIBILITY_PLAYBOOK.md docs/ROADMAP.md
          git status --short
          git commit -m "merge: integrate Auto-DJ providers for 0.5.0 RC"
          git push origin HEAD:release/0.5.0-rc.1
