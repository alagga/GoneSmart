name: Apply bundled GMMP 4.2.1 repair

on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bundled patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/gmmp421-r27-repair.patch.gz.b64 | gzip -d > /tmp/gmmp421-r27-repair.patch
          git apply --check /tmp/gmmp421-r27-repair.patch
          git apply /tmp/gmmp421-r27-repair.patch
          rm -f .github/gmmp421-r27-repair.patch.gz.b64
          rm -f .github/workflows/source-snapshot-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair GMMP 4.2.1 link callbacks and track transition"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
