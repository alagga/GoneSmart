name: GMMP 4.2.1 r39 repair temp

on:
  push:
    paths:
      - 'scripts/gmmp421_r39_fix_temp.py'
      - '.github/workflows/gmmp421-r39-fix-temp.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply r39 repair
        run: python3 scripts/gmmp421_r39_fix_temp.py
      - name: Run unit tests and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Commit repair, pin source and remove helpers
        run: |
          rm scripts/gmmp421_r39_fix_temp.py
          rm .github/workflows/gmmp421-r39-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: gate Track Mix startup to pre-Play target'
          SOURCE=$(git rev-parse HEAD)
          python3 - "$SOURCE" <<'PY'
          from pathlib import Path
          import sys
          source = sys.argv[1]
          p = Path('docs/GMMP_421_REACCEPTANCE_CHECKLIST.md')
          text = p.read_text()
          old = 'Repair source commit: `R39_REPAIR_SOURCE_PENDING`.'
          if old not in text:
              raise SystemExit('r39 source placeholder missing')
          p.write_text(text.replace(old, f'Repair source commit: `{source}`.', 1))
          PY
          git add docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          git commit -m 'docs: pin GMMP 4.2.1 r39 re-acceptance'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
