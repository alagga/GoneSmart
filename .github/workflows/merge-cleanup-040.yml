name: Clean 0.4.0 main integration

on:
  push:
    branches:
      - feature/playlist-bridge

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/merge_cleanup_040.py
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/merge-cleanup-040.yml
          rm scripts/merge_cleanup_040.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): remove stale main-integration leftovers'
          git push origin HEAD:feature/playlist-bridge
