name: One-shot queue playback r40 patch

on:
  push:
    branches: [feature/playlist-bridge]
    paths:
      - '.github/workflows/one-shot-queue-playback-r40.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge

      - name: Apply r40 queue playback patch
        run: |
          python .github/scripts/patch_queue_playback_r40.py
          git diff --check
          git diff -- app/src/main/java/io/github/alagga/gonesmart/GmmpQueueReader.kt
          git diff -- app/src/main/java/io/github/alagga/gonesmart/QueueFlipController.kt
          git diff -- app/src/main/java/io/github/alagga/gonesmart/GmmpQueueMutationBridge.kt
          git diff -- app/src/main/java/io/github/alagga/gonesmart/GoneSmartModule.kt

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/alagga/gonesmart/GmmpQueueReader.kt
          git add app/src/main/java/io/github/alagga/gonesmart/QueueFlipController.kt
          git add app/src/main/java/io/github/alagga/gonesmart/GmmpQueueMutationBridge.kt
          git add app/src/main/java/io/github/alagga/gonesmart/GoneSmartModule.kt
          git commit -m 'fix(queue): reopen real playback position boundary'
          git push origin HEAD:feature/playlist-bridge
