name: Bundled regression repair

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Apply exact bundled repair
        run: python3 scripts/bundled_regression_repair.py
      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit source and remove patch helpers
        run: |
          rm scripts/bundled_regression_repair.py .github/workflows/bundled-regression-repair.yml
          git config user.name 'GoneSmart repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair Track Mix continuity and Playlist Link discovery'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
