name: Sync 4.2.1 repair documentation
on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1
    paths:
      - .github/workflows/sync-421-trackmix-link-docs.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
      - name: Update durable docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          agents = 'AGENTS.md'
          replace_once(
              agents,
              '- Recommendation preparation must not strand playback on a one-row queue. Prewarm may run before isolation, but once an explicit Track Mix seed is isolated the Initial Size refill **must not wait for the remote Smart-DJ pool at all**: start/reuse the pool fill, let native GMMP fill immediately, and allow recommendation preparation to continue only in the background for later refills.',
              '- Recommendation preparation must not strand playback on a one-row queue. On GMMP 4.2.1, after seed isolation request exactly one native continuity row immediately so `current+1` exists, then give the already-running GoneSmart pool a bounded chance to supply the remaining Initial Size rows. If that bounded wait produces no usable pool, fail over through the same native refill boundary. Legacy 4.2.0 keeps its accepted full native initial refill.'
          )
          replace_once(
              agents,
              '- On GMMP 4.2.1, `WAIT_PLAY` is still GMMP-owned playback continuity: a natural Auto-DJ refill passes through natively. Only the Track-Mix-owned `CLEARING`/`FILLING` mutation window may suppress that refill. Seed isolation preserves the naturally verified absolute Current queue position; later compaction closes position gaps around that anchor instead of forcing Current to position 1.',
              '- On GMMP 4.2.1, `WAIT_PLAY` is still GMMP-owned playback continuity: a natural Auto-DJ refill passes through natively. Only the Track-Mix-owned `CLEARING`/`FILLING` mutation window may suppress that refill. Seed isolation preserves the naturally verified absolute Current queue position while the queue is sparse. After the full Initial Size exists, a final native-DAO rebase may move rows to `1..N` only by first materializing those row positions, then moving Current through the already passively verified writer and independently verifying row order plus Current identity. This avoids impossible counters such as `8/5` without guessing a hidden allocator.'
          )
          replace_once(
              agents,
              '- Resolve Playlist Link query-column constants by native semantic value (for example `track_uri`); historical holder and field names are fast paths only. If the holder itself is remapped, discovery may enumerate the target dex class names without initializing them, structurally filter compatible static fields, then inspect only a bounded read-only in-memory value graph. A single class whose reflection metadata cannot be resolved on the current Android runtime (for example because one of its field types links a newer framework API) is skipped rather than aborting semantic discovery. If the field object remains opaque, the already-resolved native IN predicate builder may be used only as an in-memory semantic probe; no database query or unknown method is executed. Uniqueness remains mandatory and ambiguity fails closed. Optional query capabilities must be lazy: an unproven OR-group mapping must not disable a single native-IN link, while a source that actually requires the missing group fails closed.',
              '- Playlist Link must not depend on recovering an R8-renamed `track_uri` constant. On GMMP 4.2.1, source playlist file paths are resolved to library Track IDs through the already verified read-only GMMP database bridge. The native Track-ID query-field object is recovered from the already compiled fail-closed native Track-ID predicate when uniquely inspectable; if that object remains opaque, the native Smart-rule evaluator supplies bounded Track-ID equality predicates instead. Historical query-field holder names remain diagnostic evidence only, ambiguity fails closed, and optional OR grouping stays lazy.'
          )

          playbook = 'docs/GMMP_COMPATIBILITY_PLAYBOOK.md'
          replace_once(
              playbook,
              '- after explicit seed isolation, the Initial-Size path performs **zero remote Smart-pool wait**: native GMMP fills immediately while the same pool preparation continues in the background for later refills.',
              '- after explicit seed isolation on 4.2.1, request one native continuity row immediately, then allow a bounded wait for the already-running GoneSmart pool before requesting the remaining Initial Size rows. This preserves `current+1` while still letting Track Mix actually use GoneSmart recommendations. Legacy 4.2.0 keeps the accepted full native initial refill.'
          )
          marker = 'Runtime `4cfe88ea5430` then exposed three independent defects in one bundled run.'
          p = Path(playbook)
          text = p.read_text()
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('playbook runtime anchor missing')
          paragraph_end = text.find('\n\n', idx)
          addition = ('\n\nRuntime `9c90a8e9e752` verified that anchored sparse compaction restored playback continuity but exposed two user-visible regressions. The Queue UI showed counters such as `8/5` because the Current anchor remained absolute after Initial Size existed, and the immediate full native refill filled all four post-seed rows before the asynchronous GoneSmart recommendation pool became useful. The next repair therefore splits 4.2.1 Initial Size into one immediate native continuity row plus a bounded GoneSmart remainder, then performs a final `1..N` rebase only after all rows exist and verifies Current identity through the proven writer. The same runtime still failed Playlist Link solely at semantic `track_uri` discovery, so the 4.2.1 bridge no longer depends on that column constant: it resolves source entries to Track IDs through verified read-only GMMP SQL and builds native Track-ID predicates from the already compiled fail-closed rule. Device re-acceptance remains pending.')
          text = text[:paragraph_end] + addition + text[paragraph_end:]
          p.write_text(text)

          completion = Path('docs/GMMP_421_COMPLETION.md')
          text = completion.read_text().rstrip() + '\n'
          addition = ('- 9 October 2026: runtime `9c90a8e9e752` confirmed Track Mix playback continuity but showed the anchored sparse queue as `8/5` and proved that filling all four missing Initial Size rows natively happens before GoneSmart recommendations finish. The next candidate requests one native continuity row immediately, waits only for the remaining GoneSmart rows, and performs a verified final `1..N` rebase after the full queue exists. The same run confirmed Playlist Link still failed solely because semantic `track_uri` discovery produced no field; the new binding removes that dependency by resolving source playlist entries to GMMP Track IDs through the verified read-only database bridge and compiling native Track-ID predicates from the already accepted fail-closed rule. Host unit tests and Debug build passed in the bundled repair workflow; device re-acceptance remains pending.\n')
          if addition not in text:
              completion.write_text(text + addition)
          PY
      - name: Commit docs and remove helper
        shell: bash
        run: |
          git rm .github/workflows/sync-421-trackmix-link-docs.yml
          git add AGENTS.md docs/GMMP_COMPATIBILITY_PLAYBOOK.md docs/GMMP_421_COMPLETION.md
          git -c user.name='GoneSmart repair bot' -c user.email='actions@users.noreply.github.com' commit -m 'docs: record Track Mix and Playlist Link follow-up'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
