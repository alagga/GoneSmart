name: tmp-r62-runner

on:
  push:
    branches: [fix/playlist-link-gmmp-4.2.1]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'ci run r62 patch'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Apply staged R62 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-r62-current-plus-one-predecoder.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<r62-patch>', 'exec'))
          PY

      - name: Check patch scope and invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            AGENTS.md \
            app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt \
            app/src/test/java/io/github/alagga/gonesmart/TrackMixZeroPoolPolicyTest.kt \
            docs/GMMP_COMPATIBILITY_PLAYBOOK.md | sort)"
          test "$changed" = "$expected"
          grep -q 'MIX ZERO-POOL NEXT SOURCE PREPARE' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q 'requestedTracks = 0' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q 'natural-current-plus-one-fallback' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q 'natural current plus one can bootstrap initial size' app/src/test/java/io/github/alagga/gonesmart/TrackMixZeroPoolPolicyTest.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit validated patch and remove temporary infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-r62-current-plus-one-predecoder.yml
          rm .github/workflows/tmp-r62-runner.yml
          git add AGENTS.md \
            app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt \
            app/src/test/java/io/github/alagga/gonesmart/TrackMixZeroPoolPolicyTest.kt \
            docs/GMMP_COMPATIBILITY_PLAYBOOK.md \
            .github/workflows/tmp-r62-current-plus-one-predecoder.yml \
            .github/workflows/tmp-r62-runner.yml
          git diff --cached --check
          git commit -m 'fix(track-mix): fill before first next-source read'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
