              "    private val nativeSmartChooserBypass = ThreadLocal.withInitial { false }\n",
              "    @Volatile private var linkAnchorRef: WeakReference<View>? = null\n" +
              "    @Volatile private var nativeToolbarLinkClickAtMs = 0L\n" +
