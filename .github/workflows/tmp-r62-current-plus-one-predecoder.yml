name: R62 Patch

on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Apply patch
        run: |
          python3 scripts/tmp_r62_patch.py
          python3 -c "from pathlib import Path; p=Path('docs/GMMP_COMPATIBILITY_PLAYBOOK.md'); p.write_text(p.read_text().rstrip() + '\n')"

      - name: Verify scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' AGENTS.md app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt app/src/test/java/io/github/alagga/gonesmart/TrackMixZeroPoolPolicyTest.kt docs/GMMP_COMPATIBILITY_PLAYBOOK.md | sort)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit validated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-r62-current-plus-one-predecoder.yml
          rm .github/workflows/tmp-r62-runner.yml
          rm scripts/tmp_r62_patch.py
          git add -A
          git diff --cached --check
          git commit -m 'fix(track-mix): fill before first next-source read'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
