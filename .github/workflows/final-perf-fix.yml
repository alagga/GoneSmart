name: One-shot final performance lifecycle fix

on:
  push:
    branches:
      - feature/playlist-bridge
    paths:
      - tools/final_perf_fix.py
      - .github/workflows/final-perf-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0
      - name: Apply bounded lifecycle fix
        run: python3 tools/final_perf_fix.py
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Commit lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/alagga/gonesmart/SmartPlaylistFolderController.kt
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): preserve Smart-folder initial reveal"
          git push origin HEAD:feature/playlist-bridge
