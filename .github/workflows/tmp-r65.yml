name: R65 Patch

on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Apply R65 patch
        run: python3 .github/tmp_r65_patch.py

      - name: Verify R65 scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' AGENTS.md app/src/main/java/io/github/alagga/gonesmart/GmmpQueueMutationBridge.kt app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt app/src/test/java/io/github/alagga/gonesmart/TrackMixZeroPoolPolicyTest.kt docs/GMMP_COMPATIBILITY_PLAYBOOK.md | sort)"
          grep -q 'MIX PREPLAY PREPARED POSITIONS | verified=true' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q 'compactTrackMixPreparedRefillAnchored' app/src/main/java/io/github/alagga/gonesmart/GmmpQueueMutationBridge.kt
          grep -q 'prepared queue append gaps compact before native retarget prune' app/src/test/java/io/github/alagga/gonesmart/TrackMixZeroPoolPolicyTest.kt
          grep -q 'R65 device evidence' AGENTS.md
          grep -q 'R65 prepared Queue coordinate normalization' docs/GMMP_COMPATIBILITY_PLAYBOOK.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit validated R65 patch
        shell: bash
        run: |
          rm .github/workflows/tmp-r65.yml .github/tmp_r65_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(track-mix): normalize prepared queue coordinates"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
