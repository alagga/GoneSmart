name: Integrate main for 0.4.0

on:
  push:
    branches:
      - feature/playlist-bridge

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0

      - name: Integrate main and finalize public roadmap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main

          git merge --no-ff -X ours origin/main -m 'merge: integrate main into GoneSmart 0.4.0'
          git merge-base --is-ancestor origin/main HEAD

          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          if '## Roadmap' not in text:
              marker = '---\n\n## Building\n'
              section = '''---\n\n## Roadmap\n\n### Planned for 0.5.0\n\n- **More recommendation providers:** expand Smart Auto-DJ with additional recommendation sources, with Spotify, YouTube and YouTube Music among the planned options.\n- **Bluetooth device audio profiles:** automatically switch GMMP equalizer and effects settings depending on which Bluetooth headphones, speakers, car audio system or other playback device is connected.\n\nThese items are planned and may change during development. See [docs/ROADMAP.md](docs/ROADMAP.md) for the current roadmap.\n\n---\n\n## Building\n'''
              if marker not in text:
                  raise SystemExit('README Building marker not found')
              text = text.replace(marker, section, 1)
              path.write_text(text)
          PY

          rm .github/workflows/integrate-main-040.yml
          git add -A
          git diff --cached --check
          if git grep -n '^<<<<<<<\|^=======\|^>>>>>>>' -- . ':!docs/GMMP_421_*' ; then
            echo 'Unexpected merge markers remain'
            exit 1
          fi

          git commit --amend --no-edit
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:feature/playlist-bridge
