name: Anchored normalization verification

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Apply anchored normalization repair
        run: python3 scripts/fix_anchor_normalization.py
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit repair and remove helpers
        run: |
          rm scripts/fix_anchor_normalization.py .github/workflows/fix-anchor-normalization.yml
          git config user.name 'GoneSmart repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve Track Mix current anchor during normalization'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
