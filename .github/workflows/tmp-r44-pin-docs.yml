name: Temporary r44 docs pin

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']
    paths:
      - 'scripts/tmp_r44_pin_docs.py'
      - '.github/workflows/tmp-r44-pin-docs.yml'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0
      - name: Apply r44 docs pin
        run: python3 scripts/tmp_r44_pin_docs.py
      - name: Verify pin
        run: |
          grep -F 'Repair source commit: `ab139568db9df78f49929e6621ca7c222c5fe359`.' docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          grep -F 'no seed-only interval with missing current+1' docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          grep -F 'Historical note: r36-r39 zero-provider mechanics are retired' docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
      - name: Commit docs and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/tmp_r44_pin_docs.py .github/workflows/tmp-r44-pin-docs.yml
          git add docs/GMMP_421_REACCEPTANCE_CHECKLIST.md
          git commit -m "docs: pin GMMP 4.2.1 r44 re-acceptance"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
