name: tmp-trackmix-tab-lag-fix

on:
  push:
    branches:
      - tmp-trackmix-tab-lag-fix
    paths:
      - tools/tmp_trackmix_tab_lag_fix.py
      - .github/workflows/tmp-trackmix-tab-lag-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-trackmix-tab-lag-fix
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Apply runtime fixes
        run: python3 tools/tmp_trackmix_tab_lag_fix.py
      - name: Check patch invariants
        run: |
          grep -q 'nativePositionWriterProvider(autoDj)' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q 'fun verifiedPositionWriter' app/src/main/java/io/github/alagga/gonesmart/QueueFlipController.kt
          grep -q 'negativeDiscoverySettled' app/src/main/java/io/github/alagga/gonesmart/PlaylistNavigationBadgeController.kt
          git diff --check
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit patch and remove temporary infrastructure
        run: |
          rm -f tools/tmp_trackmix_tab_lag_fix.py .github/workflows/tmp-trackmix-tab-lag-fix.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): reuse queue proof and retire empty nav scans'
          git push origin HEAD:tmp-trackmix-tab-lag-fix
