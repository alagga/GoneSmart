name: Finish 0.4.0 notification cleanup

on:
  push:
    branches:
      - feature/playlist-bridge

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0

      - name: Replace remaining symbol-only runtime notices
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          track = Path('app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt')
          text = track.read_text()
          old = '                toast(request.context, request.menuLabel + " ✓")'
          new = '                toast(request.context, request.confirmation)'
          if old not in text:
              raise SystemExit('Track Mix checkmark toast not found')
          track.write_text(text.replace(old, new, 1))

          flip = Path('app/src/main/java/io/github/alagga/gonesmart/QueueFlipController.kt')
          text = flip.read_text()
          old = '''                    if (count > 1) {
                        (nativeString(context, "queue") ?: "").trim()
                            .takeIf(String::isNotBlank)?.plus(" ✓") ?: "✓"
                    } else {
'''
          new = '''                    if (count > 1) {
                        "Queue reversed"
                    } else {
'''
          if old not in text:
              raise SystemExit('Queue Flip checkmark toast not found')
          flip.write_text(text.replace(old, new, 1))
          PY

          git diff --check

          remaining="$(grep -R -n '✓' app/src/main/java/io/github/alagga/gonesmart --include='*.kt' | grep -v '/MainActivity.kt:' || true)"
          if [[ -n "$remaining" ]]; then
            echo 'Unexpected runtime checkmark glyphs remain:'
            echo "$remaining"
            exit 1
          fi

      - name: Commit clean runtime notices and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-notice-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ui): use readable action confirmations'
          git push origin HEAD:feature/playlist-bridge
