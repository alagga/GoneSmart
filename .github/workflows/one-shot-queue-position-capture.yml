name: One-shot queue position capture patch

on:
  push:
    branches: [feature/playlist-bridge]
    paths:
      - '.github/workflows/one-shot-queue-position-capture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge

      - name: Apply queue position capture patch
        run: |
          python .github/scripts/patch_queue_position_capture.py
          git diff --check
          git diff -- app/src/main/java/io/github/alagga/gonesmart/QueueFlipController.kt

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/alagga/gonesmart/QueueFlipController.kt
          git commit -m 'fix(queue-flip): capture Auto-DJ before passive writer proof'
          git push origin HEAD:feature/playlist-bridge
