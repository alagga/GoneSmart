name: Bundled 4.2.1 repair

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repair
        run: python3 .github/scripts/apply_421_trackmix_link_repair.py

      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit repair and remove helpers
        run: |
          git config user.name "GoneSmart repair bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/bundled-421-trackmix-link-repair.yml
          git rm .github/scripts/apply_421_trackmix_link_repair.py
          git add app/src/main/java app/src/test/java
          git commit -m "fix: stabilize Track Mix and Playlist Link on GMMP 4.2.1"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
