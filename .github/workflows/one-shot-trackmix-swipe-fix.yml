name: One-shot track mix and swipe fix

on:
  push:
    branches: [tmp-trackmix-swipe-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-trackmix-swipe-fix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Apply runtime fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # --- Track Mix: no stale 4.2.0 fallback from autoDj.q; no UI-thread Future.get. ---
          p = Path('app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt')
          s = p.read_text()
          s = s.replace('import java.util.concurrent.TimeUnit\n', '')
          old = '        val before: Snapshot?,\n'
          assert old in s
          s = s.replace(old, '        @Volatile var before: Snapshot?,\n', 1)
          old = '    private val settings = GmmpAutoDjSettingsReader()\n'
          assert old in s
          s = s.replace(old, old + '    private val queueReader = GmmpQueueReader()\n', 1)

          start_marker = '        // GMMP Room forbids reads on the UI thread. Capture the old queue\n'
          end_marker = '        work.execute { runTrackMix(request) }\n'
          start = s.index(start_marker)
          end = s.index(end_marker, start) + len(end_marker)
          new_block = '''        // Capture the pre-Play identity on the worker. The old implementation
        // waited up to 350 ms on the UI thread for this Room read, which made
        // the context-menu click visibly stall. Keep the ordering proof, but
        // never block GMMP's main thread for it.
        val nativePlayDispatch: () -> Boolean = runCatching {
            val callback = field(menu, "mCallback")
            val popup = callback?.let { field(it, "this$0") }
            val listener = popup?.let {
                field(it, "mMenuItemClickListener")
                    ?: field(it, "mOnMenuItemClickListener")
            }
            val click = listener?.javaClass?.methods?.firstOrNull {
                it.name == "onMenuItemClick" &&
                    it.parameterCount == 1 &&
                    it.parameterTypes[0].isAssignableFrom(nativePlay.javaClass)
            }
            if (click != null && listener != null) {
                click.isAccessible = true
                ({ click.invoke(listener, nativePlay) as? Boolean == true })
            } else {
                ({ menu.performIdentifierAction(nativePlay.itemId, 0) })
            }
        }.getOrElse { error ->
            Log.e(TAG, "Could not capture native track Play dispatcher", error)
            ({ false })
        }

        val request = Pending(
            token = tokens.incrementAndGet(),
            context = context,
            source = source,
            before = null,
            confirmation = confirmation,
            menuLabel = menuLabel,
            createdAt = SystemClock.elapsedRealtime()
        )
        request.stage = "PREPARE"
        pending = request

        work.execute {
            val old = queueSnapshot()
            main.post {
                if (!isCurrent(request)) return@post
                request.before = old
                request.stage = "WAIT_PLAY"

                // Arm the refill barrier immediately before enabling Auto-DJ
                // and dispatching native Play. It no longer needs to cover a
                // blocking pre-Play database read.
                refillHold.set(true)
                nativeToastSuppressionUntilMs =
                    SystemClock.elapsedRealtime() + 8_000L
                suppressedToastCount.set(0)

                if (!enableSmartDj(context)) {
                    if (pending === request) pending = null
                    refillHold.set(false)
                    fail("Smart DJ could not be enabled.", context)
                    return@post
                }

                val started = runCatching {
                    nativePlayDispatch()
                }.onFailure { Log.e(TAG, "Native track Play failed", it) }
                    .getOrDefault(false)

                if (!started) {
                    if (pending === request) pending = null
                    refillHold.set(false)
                    fail("Could not start this song.", context)
                    return@post
                }

                request.nativePlayAccepted = true
                Log.i(TAG, "MIX START | menu=$source | nativePlay=dispatched")
                work.execute { runTrackMix(request) }
            }
        }
'''
          s = s[:start] + new_block + s[end:]

          old = '''    nativeAutoDj?.get()?.let { autoDj ->
        GmmpQueueReader().read(autoDj)?.let { context ->
            val currentIndex = context.items.indexOfFirst {
                it.state == QueueItemState.CURRENT
            }
            if (currentIndex >= 0) {
                return@runCatching Snapshot(
                    context.items.map { it.track.id },
                    currentIndex,
                    context.items.map { it.queueEntryId }
                )
            }
        }
    }

    // Verified 4.2.0 fallback.
    val queue = nativeQueue?.get()
        ?: nativeAutoDj?.get()?.let { field(it, "q") }
        ?: return@runCatching null
'''
          new = '''    nativeAutoDj?.get()?.let { autoDj ->
        // GMMP 4.2.1 can briefly expose a queue for which CURRENT is not yet
        // structurally resolvable while native Play is rebuilding the source.
        // Treat that as a transient read miss and let the bounded Track-Mix
        // settling loop retry. Never reinterpret autoDj.q as the old 4.2.0
        // queue wrapper: on 4.2.1 it may be a byte[] and has no H1() reader.
        val context = queueReader.read(autoDj) ?: return@runCatching null
        val currentIndex = context.items.indexOfFirst {
            it.state == QueueItemState.CURRENT
        }
        if (currentIndex < 0) return@runCatching null
        return@runCatching Snapshot(
            context.items.map { it.track.id },
            currentIndex,
            context.items.map { it.queueEntryId }
        )
    }

    // Verified 4.2.0 fallback only. Do not derive this wrapper from a 4.2.1
    // Auto-DJ field whose obfuscated name merely happens to still be `q`.
    val queue = nativeQueue?.get()
        ?.takeIf { it.javaClass.name == "ex3" }
        ?: return@runCatching null
'''
          assert old in s, 'TrackMix queueSnapshot block changed unexpectedly'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # --- Player badge: hidden proven anchors stay cached; full decor scan only after layout quiet. ---
          p = Path('app/src/main/java/io/github/alagga/gonesmart/PlayerAutoDjBadgeController.kt')
          s = p.read_text()
          s = s.replace('    private var lastScanElapsedMs = Long.MIN_VALUE\n', '')

          old = '''    private val globalLayoutListener =
        ViewTreeObserver.OnGlobalLayoutListener {
            scheduleRescan()
        }

    private val modeMonitorRunnable = object : Runnable {
'''
          new = '''    private val globalLayoutListener =
        ViewTreeObserver.OnGlobalLayoutListener {
            scheduleRescan()
        }

    private val rescanRunnable = Runnable {
        val activity = activityRef?.get() ?: return@Runnable
        if (activity.isFinishing || activity.isDestroyed) return@Runnable
        val target = targetRef?.get()
        val marker = nowPlayingMarkerRef?.get()
        if (
            isUsableNativeView(target, PLAYBACK_MODE_RESOURCE_NAME) &&
            isUsableNativeView(marker, NOW_PLAYING_MARKER_RESOURCE_NAME)
        ) {
            if (isVisibleNativeView(target) && isVisibleNativeView(marker)) {
                updateOverlayBounds(target!!)
            } else {
                clearOverlay()
            }
            return@Runnable
        }
        findAndAttach(activity, forceLog = false)
    }

    private val modeMonitorRunnable = object : Runnable {
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            if (
                target != null &&
                marker != null &&
                isUsableNativeView(target, PLAYBACK_MODE_RESOURCE_NAME) &&
                isUsableNativeView(marker, NOW_PLAYING_MARKER_RESOURCE_NAME)
            ) {
                refreshBadge(target)
            } else {
                findAndAttach(activity, forceLog = false)
            }

            scheduleModeMonitor()
'''
          new = '''            if (
                isUsableNativeView(target, PLAYBACK_MODE_RESOURCE_NAME) &&
                isUsableNativeView(marker, NOW_PLAYING_MARKER_RESOURCE_NAME)
            ) {
                if (isVisibleNativeView(target) && isVisibleNativeView(marker)) {
                    refreshBadge(target!!)
                } else {
                    clearOverlay()
                }
                scheduleModeMonitor()
            } else {
                // Do not turn a missing Now-Playing view into an endless
                // 550-ms full decor-tree scan while the user is in Library.
                // Global layout will schedule one recovery scan after the UI
                // has been quiet for the debounce window.
                clearOverlay()
                scheduleRescan()
            }
'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        val decor = activity.window?.decorView ?: return
        installGlobalLayoutListener(decor)
        scheduleModeMonitor()

        decor.post { findAndAttach(activity, forceLog = false) }
        mainHandler.postDelayed({ findAndAttach(activity, forceLog = false) }, 250L)
        mainHandler.postDelayed({ findAndAttach(activity, forceLog = false) }, 900L)
        mainHandler.postDelayed({ findAndAttach(activity, forceLog = true) }, 1800L)
'''
          new = '''        val decor = activity.window?.decorView ?: return
        installGlobalLayoutListener(decor)
        // One trailing discovery is enough. If Now Playing is created later,
        // its layout event schedules another bounded recovery scan.
        scheduleRescan()
'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('    private fun scheduleRescan() {\n')
          end = s.index('\n    private fun findAndAttach(', start)
          s = s[:start] + '''    private fun scheduleRescan() {
        val activity = activityRef?.get() ?: return
        if (activity.isFinishing || activity.isDestroyed) return
        val target = targetRef?.get()
        val marker = nowPlayingMarkerRef?.get()

        // A hidden ViewPager/Now-Playing anchor is not a lost anchor. During
        // Library swipes GMMP toggles isShown constantly; keep the verified
        // resource-identity binding and avoid rebuilding the decor inventory.
        if (
            isUsableNativeView(target, PLAYBACK_MODE_RESOURCE_NAME) &&
            isUsableNativeView(marker, NOW_PLAYING_MARKER_RESOURCE_NAME)
        ) {
            mainHandler.removeCallbacks(rescanRunnable)
            if (isVisibleNativeView(target) && isVisibleNativeView(marker)) {
                updateOverlayBounds(target!!)
            } else {
                clearOverlay()
            }
            return
        }

        // True trailing debounce: continuous ViewPager layout waves keep
        // pushing this one recovery scan back instead of executing a full
        // recursive decor traversal every debounce interval.
        mainHandler.removeCallbacks(rescanRunnable)
        mainHandler.postDelayed(rescanRunnable, RESCAN_DEBOUNCE_MS)
    }
''' + s[end:]

          old = '''    private fun isUsableNativeView(view: View?, expectedResourceName: String): Boolean {
        return view != null &&
            view.isAttachedToWindow &&
            view.isShown &&
            view.width > 0 &&
            view.height > 0 &&
            resourceName(view).equals(expectedResourceName, ignoreCase = true)
    }
'''
          new = '''    private fun isUsableNativeView(view: View?, expectedResourceName: String): Boolean {
        return view != null &&
            view.isAttachedToWindow &&
            resourceName(view).equals(expectedResourceName, ignoreCase = true)
    }

    private fun isVisibleNativeView(view: View?): Boolean =
        view != null &&
            view.isAttachedToWindow &&
            view.isShown &&
            view.width > 0 &&
            view.height > 0
'''
          assert old in s
          s = s.replace(old, new, 1)

          # When discovery succeeds after the monitor stopped on a missing
          # target, restart the now-cheap monitor.
          old = '''            updateOverlayBounds(target)
            refreshBadge(target)
            return
'''
          new = '''            updateOverlayBounds(target)
            refreshBadge(target)
            scheduleModeMonitor()
            return
'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        refreshBadge(target)
    }

    private fun isUsableNativeView'''
          new = '''        refreshBadge(target)
        scheduleModeMonitor()
    }

    private fun isUsableNativeView'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # --- Navigation badge: hidden verified labels remain valid. ---
          p = Path('app/src/main/java/io/github/alagga/gonesmart/PlaylistNavigationBadgeController.kt')
          s = p.read_text()
          old = '''        if (!isVisible(view) || insideClassicDrawer(view) ||
            !hasClickableAncestor(view)
        ) return false
'''
          new = '''        // ViewPager/tab transitions routinely hide a still-valid native label.
        // Visibility is a discovery criterion, not semantic target identity.
        // Keeping attached verified labels cached avoids a full decor scan on
        // every swipe layout wave.
        if (!view.isAttachedToWindow || insideClassicDrawer(view) ||
            !hasClickableAncestor(view)
        ) return false
'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Persistent rules: record the exact regression so future migrations
          # do not reintroduce visibility-as-identity or stale legacy fallback.
          p = Path('AGENTS.md')
          s = p.read_text()
          anchor = '- Full view-tree scans may remain as a bounded recovery path when a cached native target is detached/replaced, but must not run continuously during normal pager/layout waves.\n'
          assert anchor in s
          addition = '''- `View.isShown == false` during a ViewPager transition does **not** invalidate a semantically verified native UI anchor. Treat visibility as a rendering/discovery condition, not target identity; only detach/replacement/resource mismatch should force structural rediscovery.\n- Version-specific legacy fallbacks must never be reached merely because the accepted-version reader has a transient unresolved state. In particular Track Mix on 4.2.1 must retry the semantic Queue reader when CURRENT is temporarily unresolved; it must not reinterpret an obfuscated Auto-DJ field as the 4.2.0 queue wrapper.\n- Pre-action Room/Queue reads used as race barriers must not block GMMP's main thread with `Future.get(...)`. Preserve before/after ordering by doing the read on a worker and dispatching the native action back to main afterward.\n'''
          if addition not in s:
              s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s)
          PY

      - name: Check diff
        run: |
          git diff --check
          git diff --stat
          grep -R "TimeUnit" -n app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt && exit 1 || true
          grep -R "nativeAutoDj?.get()?.let { field(it, \"q\") }" -n app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt && exit 1 || true

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-trackmix-swipe-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): repair track mix and stop swipe scans"
          git push origin HEAD:tmp-trackmix-swipe-fix
