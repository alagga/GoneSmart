name: Apply runtime build identity (one-time)

on:
  push:
    branches: [fix/playlist-link-gmmp-4.2.1]
    paths:
      - '.github/workflows/apply-runtime-build-identity.yml'
      - 'scripts/apply_runtime_build_identity.py'

permissions:
  contents: write

env:
  BRANCH_NAME: fix/playlist-link-gmmp-4.2.1

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0

      - name: Apply runtime build identity
        run: python3 scripts/apply_runtime_build_identity.py

      - name: Commit exact candidate locally
        id: candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/apply_runtime_build_identity.py .github/workflows/apply-runtime-build-identity.yml
          git add AGENTS.md docs/GMMP_COMPATIBILITY_PLAYBOOK.md app/build.gradle.kts app/src
          git diff --cached --check
          git commit -m "chore: expose exact runtime build revision"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify embedded candidate revision
        run: |
          set -euo pipefail
          expected="$(git rev-parse --short=12 HEAD)"
          grep -R --binary-files=text -q "$expected" app/build/generated/source/buildConfig/debug || {
            echo "Expected BuildConfig revision $expected was not generated"
            exit 1
          }

      - name: Push verified exact candidate
        run: git push origin HEAD:${BRANCH_NAME}
