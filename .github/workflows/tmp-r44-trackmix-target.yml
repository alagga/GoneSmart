name: Temporary r44 Track Mix target validation

on:
  push:
    branches: ['feature/tmp-r44-trackmix-target']

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/tmp-r44-trackmix-target
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Apply r44 patch
        run: |
          python3 scripts/tmp_r44_patch.py
          git diff --check
          grep -q 'MIX PLAY RETARGETED' app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q 'shouldRetargetTransientTarget' app/src/main/java/io/github/alagga/gonesmart/TrackMixQueueSettlingPolicy.kt
          grep -q 'vanishedProvisionalSmartPlaylistCurrentMayBeRetargetedInsideGuard' app/src/test/java/io/github/alagga/gonesmart/TrackMixQueueSettlingPolicyTest.kt

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit validated patch
        run: |
          rm .github/workflows/tmp-r44-trackmix-target.yml scripts/tmp_r44_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/GMMP_COMPATIBILITY_PLAYBOOK.md app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt app/src/main/java/io/github/alagga/gonesmart/TrackMixQueueSettlingPolicy.kt app/src/test/java/io/github/alagga/gonesmart/TrackMixQueueSettlingPolicyTest.kt .github/workflows/tmp-r44-trackmix-target.yml scripts/tmp_r44_patch.py
          git commit -m 'fix(track-mix): reject transient Smart Playlist current'
          git push origin HEAD:feature/tmp-r44-trackmix-target
