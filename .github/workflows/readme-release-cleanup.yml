name: Finalize 0.4.0 README

on:
  push:
    branches:
      - feature/playlist-bridge

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0

      - name: Apply README cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/readme_release_cleanup.py
          git diff --check

      - name: Commit README cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/readme-release-cleanup.yml
          rm scripts/readme_release_cleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(release): align README with 0.4.0 acceptance'
          git push origin HEAD:feature/playlist-bridge
