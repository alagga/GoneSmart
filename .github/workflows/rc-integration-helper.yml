name: RC Final Audit Apply

on:
  push:
    branches: ['release/0.5.0-rc.1']
    paths: ['.github/workflows/rc-integration-helper.yml']

permissions:
  contents: write

jobs:
  apply-final-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate final RC audit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GoneSmart RC integration"
          git config user.email "69852271+alagga@users.noreply.github.com"

          cat .github/rc-patch/part* | base64 -d | gzip -d > /tmp/gonesmart-050-rc1.patch
          echo "e6e1f6c59495e946dfdf9b6c746dd5ae5b26c9f64c4cd864918bf2bb09b1ebd8  /tmp/gonesmart-050-rc1.patch" | sha256sum -c -
          git apply --check /tmp/gonesmart-050-rc1.patch
          git apply /tmp/gonesmart-050-rc1.patch
          rm -rf .github/rc-patch

          python3 -m py_compile scripts/generate_forum_posts.py
          python3 scripts/generate_forum_posts.py --check
          test "$(grep -E 'versionName = "0\.5\.0-rc\.1"' app/build.gradle.kts | wc -l)" -eq 1
          test "$(grep -E 'versionCode = 48' app/build.gradle.kts | wc -l)" -eq 1
          test -z "$(git grep -n -E '^(<<<<<<< |>>>>>>> )' -- . ':!docs/forum/*' || true)"
          git diff --check

          git add -A
          git diff --cached --check
          git status --short
          git commit -m "release: prepare 0.5.0-rc.1"
          git push origin HEAD:release/0.5.0-rc.1
