name: Temporary GMMP 4.2.1 r29 repair

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']
    paths:
      - '.github/workflows/gmmp421-r29-fix-temp.yml'
      - '.github/r29_apply.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Apply r29 repair
        run: python3 .github/r29_apply.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate r29 repair
        run: |
          chmod +x gradlew
          python3 scripts/generate_forum_posts.py --check
          ./gradlew :app:testDebugUnitTest --stacktrace
          ./gradlew :app:assembleDebug --stacktrace

      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/gmmp421-r29-fix-temp.yml .github/r29_apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep Track Mix current+1 alive and restore link chooser"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
