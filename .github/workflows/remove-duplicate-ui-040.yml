name: Remove duplicate 0.4.0 UI merge block

on:
  push:
    branches:
      - feature/playlist-bridge

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/remove_duplicate_ui_040.py
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remove-duplicate-ui-040.yml
          rm scripts/remove_duplicate_ui_040.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): remove duplicate UI merge block'
          git push origin HEAD:feature/playlist-bridge
