          # -----------------------------------------------------------------
          # Track Mix: recover a live accepted qr instance passively from the
          # context-menu graph when constructor/refill observation happened
          # before GoneSmart's hooks. Also capture qr on already-proven natural
          # state-writer calls. No command is issued for discovery.
          # -----------------------------------------------------------------
          Path("app/src/main/java/io/github/alagga/gonesmart/TrackMixAutoDjResolver.kt").write_text(r'''package io.github.alagga.gonesmart

import java.lang.reflect.Modifier
import java.util.ArrayDeque
import java.util.IdentityHashMap

internal class TrackMixAutoDjResolver(
    private val acceptedClassName: String = "qr",
    private val refillMethodName: String = "z",
    private val maxDepth: Int = 5,
    private val maxObjects: Int = 240,
    private val maxCollectionItems: Int = 48
) {
    private data class Node(val value: Any, val depth: Int)

    fun resolve(roots: List<Any?>): Any? {
        if (roots.isEmpty()) return null
        val queue = ArrayDeque<Node>()
        roots.filterNotNull().forEach { queue.add(Node(it, 0)) }
        val visited = IdentityHashMap<Any, Boolean>()
        val candidates = arrayListOf<Any>()
        var inspected = 0

        while (queue.isNotEmpty() && inspected < maxObjects) {
            val node = queue.removeFirst()
            if (visited.put(node.value, true) != null) continue
            inspected++
            if (isAcceptedAutoDj(node.value)) {
                if (candidates.none { it === node.value }) candidates += node.value
                if (candidates.size > 1) return null
            }
            if (node.depth >= maxDepth) continue
            children(node.value).take(maxCollectionItems).forEach { child ->
                if (visited[child] == null && shouldTraverse(child)) {
                    queue.add(Node(child, node.depth + 1))
                }
            }
        }
        return candidates.singleOrNull()
    }

    private fun isAcceptedAutoDj(value: Any): Boolean {
        if (value.javaClass.name != acceptedClassName) return false
        return methods(value.javaClass).any { method ->
            !Modifier.isStatic(method.modifiers) &&
                method.name == refillMethodName &&
                method.parameterTypes.contentEquals(arrayOf(Integer.TYPE))
        }
    }

    private fun children(value: Any): Sequence<Any> = sequence {
        when (value) {
            is Iterable<*> -> {
                value.take(maxCollectionItems).filterNotNull().forEach { yield(it) }
                return@sequence
            }
            is Map<*, *> -> {
                value.entries.take(maxCollectionItems).forEach { entry ->
                    entry.key?.let { yield(it) }
                    entry.value?.let { yield(it) }
                }
                return@sequence
            }
        }
        if (value.javaClass.isArray) {
            val size = java.lang.reflect.Array.getLength(value).coerceAtMost(maxCollectionItems)
            repeat(size) { index ->
                java.lang.reflect.Array.get(value, index)?.let { yield(it) }
            }
            return@sequence
        }
        fields(value.javaClass).forEach { field ->
            val child = runCatching {
                field.isAccessible = true
                field.get(value)
            }.getOrNull() ?: return@forEach
            if (!isScalar(child)) yield(child)
        }
    }

    private fun fields(type: Class<*>): List<java.lang.reflect.Field> =
        generateSequence<Class<*>>(type) { it.superclass }
            .takeWhile { it != Any::class.java }
            .flatMap { it.declaredFields.asSequence() }
            .filterNot { Modifier.isStatic(it.modifiers) }
            .toList()

    private fun methods(type: Class<*>): Sequence<java.lang.reflect.Method> =
        generateSequence<Class<*>>(type) { it.superclass }
            .takeWhile { it != Any::class.java }
            .flatMap { it.declaredMethods.asSequence() }

    private fun shouldTraverse(value: Any): Boolean {
        if (isScalar(value)) return false
        if (isAcceptedAutoDj(value)) return true
        if (value is Iterable<*> || value is Map<*, *> || value.javaClass.isArray) return true
        val name = value.javaClass.name
        return !(
            name.startsWith("java.lang.") ||
                name.startsWith("java.util.concurrent.") ||
                name.startsWith("kotlin.")
        )
    }

    private fun isScalar(value: Any): Boolean =
        value is CharSequence || value is Number || value is Boolean ||
            value is Char || value.javaClass.isEnum
}
''')

          Path("app/src/test/java/io/github/alagga/gonesmart/TrackMixAutoDjResolverTest.kt").write_text(r'''package io.github.alagga.gonesmart

import org.junit.Assert.assertNull
import org.junit.Assert.assertSame
import org.junit.Test

class TrackMixAutoDjResolverTest {
    private class FakeAutoDj { @Suppress("UNUSED_PARAMETER") fun z(count: Int) = Unit }
    private data class Holder(val child: Any?)

    @Test fun resolvesOneAcceptedInstanceFromNestedGraph() {
        val target = FakeAutoDj()
        val resolver = TrackMixAutoDjResolver(
            acceptedClassName = FakeAutoDj::class.java.name
        )
        assertSame(target, resolver.resolve(listOf(Holder(Holder(target)))))
    }

    @Test fun ambiguityFailsClosed() {
        val resolver = TrackMixAutoDjResolver(
            acceptedClassName = FakeAutoDj::class.java.name
        )
        assertNull(resolver.resolve(listOf(Holder(FakeAutoDj()), Holder(FakeAutoDj()))))
    }

    @Test fun unrelatedObjectDoesNotResolve() {
        val resolver = TrackMixAutoDjResolver(
            acceptedClassName = FakeAutoDj::class.java.name
        )
        assertNull(resolver.resolve(listOf(Holder("nothing"))))
    }
}
''')

          mix = Path("app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt")
          m = mix.read_text()
          old_reader = '''    private val events = GoneSmartRuntimeReporter()\n    private val settings = GmmpAutoDjSettingsReader()\n    private val queueReader = GmmpQueueReader()\n'''
          new_reader = old_reader + '''    private val prePlayAutoDjResolver = TrackMixAutoDjResolver()\n'''
          if old_reader not in m:
              raise SystemExit("TrackMixController reader fields missing")
          m = m.replace(old_reader, new_reader, 1)
          old_roots = '''        val prePlayRoots = listOfNotNull(listener, popup, callback)\n            .distinctBy { System.identityHashCode(it) }\n'''
          new_roots = '''        val prePlayRoots = listOfNotNull(\n            listener, popup, callback, menu, nativePlay\n        ).distinctBy { System.identityHashCode(it) }\n        Log.i(\n            TAG,\n            "MIX CLICK | source=$source | roots=${prePlayRoots.size} | " +\n                "autoDjCaptured=${nativeAutoDj?.get() != null}"\n        )\n'''
          if old_roots not in m:
              raise SystemExit("TrackMixController prePlayRoots block missing")
          m = m.replace(old_roots, new_roots, 1)
          old_auto = '''            val old = queueSnapshot()\n            val autoDj = nativeAutoDj?.get()\n            val legacyQueue = autoDj?.let {\n                field(it, "q")?.javaClass?.name == "ex3"\n            } == true || nativeQueue?.get()?.javaClass?.name == "ex3"\n\n            if (!legacyQueue) {\n                if (autoDj == null) {\n                    if (pending === request) pending = null\n                    main.post { fail("Could not access Auto-DJ for this song.", context) }\n                    return@execute\n                }\n'''
          new_auto = '''            val old = queueSnapshot()\n            val capturedAutoDj = nativeAutoDj?.get()\n            val autoDj = capturedAutoDj ?: prePlayAutoDjResolver\n                .resolve(prePlayRoots)\n                ?.also { recovered ->\n                    captureNativeAutoDj(recovered)\n                    Log.i(TAG, "MIX PREPLAY AUTO-DJ | recovered=context-graph")\n                }\n            val legacyQueue = autoDj?.let {\n                field(it, "q")?.javaClass?.name == "ex3"\n            } == true || nativeQueue?.get()?.javaClass?.name == "ex3"\n\n            if (!legacyQueue) {\n                if (autoDj == null) {\n                    Log.w(\n                        TAG,\n                        "MIX PREPLAY AUTO-DJ | available=false | roots=${prePlayRoots.size}"\n                    )\n                    if (pending === request) pending = null\n                    main.post { fail("Could not access Auto-DJ for this song.", context) }\n                    return@execute\n                }\n                if (capturedAutoDj != null) {\n                    Log.i(TAG, "MIX PREPLAY AUTO-DJ | available=true | source=captured")\n                }\n'''
          if old_auto not in m:
              raise SystemExit("TrackMixController autoDj preplay block missing")
          m = m.replace(old_auto, new_auto, 1)
          mix.write_text(m)

          resolver = Path("app/src/main/java/io/github/alagga/gonesmart/TrackMixPrePlayTargetResolver.kt")
          r = resolver.read_text()
          r = r.replace(
              '    private val maxDepth: Int = 4,\n    private val maxObjects: Int = 160,\n    private val maxCollectionItems: Int = 24\n',
              '    private val maxDepth: Int = 5,\n    private val maxObjects: Int = 240,\n    private val maxCollectionItems: Int = 48\n',
              1
          )
          resolver.write_text(r)

          module = Path("app/src/main/java/io/github/alagga/gonesmart/GoneSmartModule.kt")
          g = module.read_text()
          if '"gmmp421-r30"' not in g:
              raise SystemExit("compat revision r30 missing")
          g = g.replace('"gmmp421-r30"', '"gmmp421-r31"', 1)
          old_writer = '''            stateWriterCandidates.forEach { method ->\n                method.isAccessible = true\n                hook(method).intercept { chain ->\n                    queueFlipController.aroundNativeStatePositionCommand(\n                        receiver = chain.getThisObject(),\n                        method = method,\n                        value = (chain.getArg(0) as? Number)?.toInt()\n                    ) {\n                        chain.proceed()\n                    }\n                }\n            }\n'''
          new_writer = '''            stateWriterCandidates.forEach { method ->\n                method.isAccessible = true\n                hook(method).intercept { chain ->\n                    val receiver = chain.getThisObject()\n                    if (receiver != null) {\n                        trackMixAutoDj = WeakReference(receiver)\n                        trackMixController.captureNativeAutoDj(receiver)\n                        queueFlipController.captureNativeAutoDj(receiver)\n                    }\n                    queueFlipController.aroundNativeStatePositionCommand(\n                        receiver = receiver,\n                        method = method,\n                        value = (chain.getArg(0) as? Number)?.toInt()\n                    ) {\n                        chain.proceed()\n                    }\n                }\n            }\n'''
          if old_writer not in g:
              raise SystemExit("GoneSmartModule qr state-writer hook missing")
          g = g.replace(old_writer, new_writer, 1)
          module.write_text(g)

          # Durable compatibility rules / current acceptance notes.
          agents = Path("AGENTS.md")
          a = agents.read_text()
          marker = "\n## r31 device-proven follow-up rules\n"
          if marker not in a:
              a += marker + '''\n- GMMP 4.2.1's accepted direct read-only Room query carrier is parameter-free unless non-zero argument-count ownership is uniquely proved. Playlist Link resolves ordinary-playlist file membership by building a bounded cached `song_id`/`track_uri` index with a parameter-free read and matching canonical paths in GoneSmart. Never guess R8 argument-count/binder fields.\n- Track Auto-DJ pre-Play preparation must not assume `qr` was constructed after GoneSmart hooks installed. Recover the live accepted `qr` passively from natural verified state-writer calls and, if needed, from the bounded context-menu object graph. Discovery never sends a playback/Auto-DJ command; zero or multiple candidates fail closed.\n- Smart-editor labels distinguish native Smart-Playlist references from GoneSmart ordinary-Playlist bridge references: native Smart references use the host Smart-Playlist noun; bridge references use the host Playlist noun.\n'''
              agents.write_text(a)

          playbook = Path("docs/GMMP_COMPATIBILITY_PLAYBOOK.md")
          p = playbook.read_text()
          if "## r31: parameter-free Playlist Link membership and pre-Play qr recovery" not in p:
              p += '''\n\n## r31: parameter-free Playlist Link membership and pre-Play qr recovery\n\nThe r30 device log accepted the Playlist Link two-way chooser but exposed two independent follow-ups. Ordinary `.m3u` parsing succeeded while the subsequent parameterized `track_uri IN (...)` lookup failed because the accepted 4.2.1 direct Room carrier has no uniquely writable non-zero argument-count field. r31 therefore builds a short-lived parameter-free `song_id`/`track_uri` index and performs canonical-path membership matching in GoneSmart. Native Smart-link labels and ordinary Playlist-link labels are also separated at the formatter boundary.\n\nTrack Auto-DJ r30 could fail before its first pre-Play diagnostic when no `qr` instance had yet been captured by the constructor/refill hooks. r31 adds passive recovery on already-proven natural `qr` state-writer calls and a bounded read-only context-menu graph lookup. It does not issue a command to discover `qr`, does not restore `CLEAR_QUEUE`, and keeps the pre-Play recommendation/bootstrap invariant.\n'''
              playbook.write_text(p)

          completion = Path("docs/GMMP_421_COMPLETION.md")
          comp = completion.read_text()
          if "r31 device acceptance" not in comp:
              comp += '''\n\n### r31 device acceptance pending\n\n- Playlist Link chooser dispatch is device-proven on r30 and retained unchanged. r31 fixes ordinary Playlist membership resolution with a parameter-free cached Track-URI index and makes rule labels type-correct (`Smart-Playlist: …` vs `Playlist: …`).\n- Track Auto-DJ keeps r30's pre-Play bootstrap design but no longer requires a constructor/refill hook to have captured `qr` earlier in the process. Passive recovery is bundled before the next single device pass.\n'''
              completion.write_text(comp)

          checklist = Path("docs/GMMP_421_REACCEPTANCE_CHECKLIST.md")
          q = checklist.read_text()
          q = q.replace(
              "This checklist is the single device pass for the current **r30** Playlist Link / Track Mix repair candidate.",
              "This checklist is the single device pass for the current **r31** Playlist Link / Track Mix repair candidate.",
              1
          )
          if "## r31 regression focus" not in q:
              q += '''\n\n## r31 regression focus\n\n- Playlist Link must retain the r30 accepted dispatch path: native Link click -> `toolbarAdd=true | edit=false | intercepted=true` -> the two-way **Smart Playlist / Playlist** menu.\n- In the Smart Playlist editor, a native linked Smart Playlist must render with the host Smart-Playlist label, while a GoneSmart ordinary Playlist bridge must render with the host Playlist label.\n- Opening/evaluating a Smart Playlist linked to an ordinary playlist must log `BRIDGE SOURCE IDS` with resolved library IDs and must not log `GMMP direct query carrier initialization failed` or compile the bridge through the Long.MIN fail-closed sentinel. Changing the source playlist must still change membership on the next evaluation.\n- Track Auto-DJ must log `MIX CLICK`, then `MIX PREPLAY AUTO-DJ | available=true` or `recovered=context-graph`, then a unique `MIX PREPLAY TARGET | resolved=true` and `MIX PREPLAY SMART POOL` before native Play.\n- 4.2.1 Track Auto-DJ still must not use `CLEAR_QUEUE`, post-retarget a materialized `current+1`, or send a discovery command merely to obtain `qr`. The first generated follow-up must naturally decode and play.\n'''
          checklist.write_text(q)
          PY

