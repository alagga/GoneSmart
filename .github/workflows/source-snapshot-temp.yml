name: Bundled repair temp

on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bundled repair and remove temporary helper
        shell: bash
        env:
          REPAIR_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$REPAIR_B64" | base64 -d | gzip -d > /tmp/gonesmart-repair.patch
          git apply --index /tmp/gonesmart-repair.patch
          git rm .github/workflows/source-snapshot-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: repair GMMP 4.2.1 Playlist Link and Track Mix"
          git push origin "HEAD:${GITHUB_REF_NAME}"
