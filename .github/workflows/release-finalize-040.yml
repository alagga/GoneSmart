name: Finalize GoneSmart 0.4.0

on:
  push:
    branches:
      - feature/playlist-bridge

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0

      - name: Apply final audit cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_finalize_040.py
          git diff --check

          echo 'Remaining checkmark glyphs in Kotlin source (review only):'
          grep -R -n '✓' app/src/main/java/io/github/alagga/gonesmart --include='*.kt' || true

          echo 'Temporary-looking tracked paths before self-cleanup (review only):'
          git ls-files | grep -Ei '(^|/)(tmp|temp)[^/]*|release_finalize_040|release-finalize-040' || true

      - name: Delete old temporary branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            tmp-do-not-use
            tmp-do-not-use-2
            tmp-final-patch
            tmp-ignore
            tmp-oops
            tmp-queue-continuity-r42
            tmp-stop
            tmp-stop2
            tmp-trackmix-swipe-fix
            tmp-trackmix-swipe-fix-2
            tmp-trackmix-tab-lag-fix
            tmp-why
            feature/tmp-r43-autodj-continuity
            feature/tmp-r44-trackmix-target
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            fi
          done

      - name: Commit clean 0.4.0 release candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-finalize-040.yml
          rm scripts/release_finalize_040.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): finalize GoneSmart 0.4.0'
          git push origin HEAD:feature/playlist-bridge
