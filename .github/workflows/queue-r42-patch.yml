name: Queue r42 one-shot patch

on:
  push:
    branches: [feature/playlist-bridge]
    paths:
      - tools/queue_r42_patch.py
      - .github/workflows/queue-r42-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0
      - name: Apply bounded patch
        run: python tools/queue_r42_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/alagga/gonesmart/GmmpQueueReader.kt \
                  app/src/main/java/io/github/alagga/gonesmart/GmmpQueueMutationBridge.kt \
                  app/src/main/java/io/github/alagga/gonesmart/NativeQueuePositionWriterObserver.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(queue): bind flip to absolute native position"
            git push origin HEAD:feature/playlist-bridge
          fi
