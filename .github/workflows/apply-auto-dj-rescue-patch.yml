name: Apply Auto DJ Rescue Patch

on:
  push:
    branches: ['feature/auto-dj-providers']
    paths:
      - '.github/workflows/apply-auto-dj-rescue-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/auto-dj-providers
          fetch-depth: 0

      - name: Apply bounded patch
        run: |
          sed -i 's/if count != 3:/if count != 2:/' scripts/apply_auto_dj_rescue_patch.py
          sed -i 's/expected 3 requestedTracks readiness checks/expected 2 requestedTracks readiness checks/' scripts/apply_auto_dj_rescue_patch.py
          python3 scripts/apply_auto_dj_rescue_patch.py
          git diff --check

      - name: Verify generated forum copy
        run: python3 scripts/generate_forum_posts.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK smoke
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Commit implementation and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_auto_dj_rescue_patch.py scripts/apply_auto_dj_rescue_patch.py.gz .github/workflows/apply-auto-dj-rescue-patch.yml
          git add -A
          git commit -m "fix(auto-dj): stage artist rescue and prevent version duplicates"
          git push origin HEAD:feature/auto-dj-providers
