name: RC Integration Repair

on:
  push:
    branches: ['release/0.5.0-rc.1']
    paths: ['.github/workflows/rc-integration-helper.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair audited GmmpLibraryReader merge boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GoneSmart RC integration"
          git config user.email "69852271+alagga@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/io/github/alagga/gonesmart/GmmpLibraryReader.kt')
          text = path.read_text()

          old_header = '''internal data class GmmpLibraryPathIndexSnapshot(\n    val trackCount: Int,\n    val idsByPath: Map<String, Long>,\n    val ambiguousPaths: Set<String>\n\nprivate data class LibraryRevision('''
          new_header = '''internal data class GmmpLibraryPathIndexSnapshot(\n    val trackCount: Int,\n    val idsByPath: Map<String, Long>,\n    val ambiguousPaths: Set<String>\n)\n\nprivate data class LibraryRevision('''

          old_dao_tail = '''                )\n                    ?: throw IllegalStateException(\n                        "TrackDao fast path is null"\n                    )\n            }.getOrElse {\n                // The obfuscated TrackDao field is a tested-version fast path,\n                // never a compatibility requirement. The semantic read-only\n                // Room/Cursor resolver below is sufficient on its own and is\n                // the accepted GMMP 4.2.1 path when DAO mappings move.\n                val tracks = loadLibraryThroughCursor(\n                    autoDjInstance,\n                    startTime\n                )\n                deterministicMappingFailure = false\n                return tracks\n            }\n\n        val queryMethod ='''
          new_dao_tail = '''                )\n\n        val queryMethod ='''

          if text.count(old_header) != 1:
              raise SystemExit('Expected exactly one malformed snapshot/revision boundary')
          if text.count(old_dao_tail) != 1:
              raise SystemExit('Expected exactly one malformed TrackDAO merge tail')

          text = text.replace(old_header, new_header)
          text = text.replace(old_dao_tail, new_dao_tail)
          path.write_text(text)
          PY

          git diff --check
          git diff -- app/src/main/java/io/github/alagga/gonesmart/GmmpLibraryReader.kt
          git add app/src/main/java/io/github/alagga/gonesmart/GmmpLibraryReader.kt
          git commit -m "fix: repair merged GMMP library reader"
          git push origin HEAD:release/0.5.0-rc.1
