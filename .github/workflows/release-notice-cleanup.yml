name: Finish GoneSmart 0.4.0 notifications

on:
  push:
    branches:
      - feature/playlist-bridge

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/playlist-bridge
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_notice_cleanup.py
          git diff --check
          remaining="$(grep -R -n '✓' app/src/main/java/io/github/alagga/gonesmart --include='*.kt' | grep -v '/MainActivity.kt:' || true)"
          test -z "$remaining"

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/release-notice-cleanup.yml
          rm scripts/release_notice_cleanup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ui): use readable action confirmations'
          git push origin HEAD:feature/playlist-bridge
