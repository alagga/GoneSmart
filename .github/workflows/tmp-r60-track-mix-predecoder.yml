name: tmp-r60-track-mix-predecoder

on:
  push:
    branches:
      - "fix/playlist-link-gmmp-4.2.1"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Verify staging files
        run: |
          test -f tools/r60_track_mix_predecoder_patch.py
          test -f .github/workflows/tmp-r60-track-mix-predecoder.yml

      - name: Apply bounded R60 patch
        run: python3 tools/r60_track_mix_predecoder_patch.py

      - name: Check patch scope and invariants
        run: |
          git diff --check
          git diff --stat
          grep -q "owner=predecoder-4.2.0-semantics" app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q "route=predecoder-4.2.0-semantics" app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt
          grep -q "usePredecoderCompatibility" app/src/main/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicy.kt
          grep -q "menu_gm_context_queue" app/src/test/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicyTest.kt
          grep -q "Track Auto-DJ 4.2.0 semantic port (R60)" AGENTS.md
          grep -q "Track Auto-DJ predecoder semantic port" docs/GMMP_COMPATIBILITY_PLAYBOOK.md
          ! grep -q "NEXT SOURCE REFRESH" app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug build
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Commit validated patch and remove temporary infrastructure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-r60-track-mix-predecoder.yml tools/r60_track_mix_predecoder_patch.py
          git add AGENTS.md docs/GMMP_COMPATIBILITY_PLAYBOOK.md app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt app/src/main/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicy.kt app/src/test/java/io/github/alagga/gonesmart/TrackMixInitialFillPolicyTest.kt
          git diff --cached --check
          git commit -m "fix(track-mix): restore predecoder 4.2.0 semantics"
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
