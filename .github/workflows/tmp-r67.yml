name: R67 Patch

on:
  push:
    branches: ['fix/playlist-link-gmmp-4.2.1']
    paths:
      - 'scripts/tmp_r67_patch.py'
      - '.github/workflows/tmp-r67.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Apply R67 patch
        run: python3 scripts/tmp_r67_patch.py

      - name: Verify R67 scope
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'AGENTS.md',
              'app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt',
              'app/src/main/java/io/github/alagga/gonesmart/TrackMixFileBrowserMenuResolver.kt',
              'app/src/test/java/io/github/alagga/gonesmart/TrackMixFileBrowserMenuResolverTest.kt',
              'docs/GMMP_COMPATIBILITY_PLAYBOOK.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected or missing:
              raise SystemExit(f'unexpected={sorted(unexpected)} missing={sorted(missing)} changed={sorted(changed)}')
          print('R67 scope:', *sorted(changed), sep='\n- ')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Unit tests and debug build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit validated R67 patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/tmp_r67_patch.py .github/workflows/tmp-r67.yml
          git add AGENTS.md app/src/main/java/io/github/alagga/gonesmart/TrackMixController.kt app/src/main/java/io/github/alagga/gonesmart/TrackMixFileBrowserMenuResolver.kt app/src/test/java/io/github/alagga/gonesmart/TrackMixFileBrowserMenuResolverTest.kt docs/GMMP_COMPATIBILITY_PLAYBOOK.md
          git diff --cached --check
          git commit -m 'fix(track-mix): hide folder Auto-DJ action'
          git push origin HEAD:fix/playlist-link-gmmp-4.2.1
