name: GMMP 4.2.1 r31 repair temp

on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/playlist-link-gmmp-4.2.1
          fetch-depth: 0

      - name: Apply r31 repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          # -----------------------------------------------------------------
          # Playlist Link: label native Smart links distinctly and resolve
          # ordinary playlist membership through a parameter-free library
          # path index. 4.2.1's direct Room carrier does not expose a unique
          # writable non-zero argument-count field, so parameterized queries
          # must stay fail-closed rather than guessing R8 fields.
          # -----------------------------------------------------------------
          controller = Path("app/src/main/java/io/github/alagga/gonesmart/PlaylistBridgeController.kt")
          c = controller.read_text()
          c = c.replace(
              '        private const val MAX_IN_VALUES = 800\n',
              '        private const val LIBRARY_PATH_INDEX_MAX_AGE_MS = 2L * 60L * 1000L\n',
              1
          )
          membership = '''    private data class Membership(\n        val lastModified: Long,\n        val length: Long,\n        val paths: List<String>\n    )\n'''
          index_data = membership + '''\n    private data class LibraryPathIndex(\n        val databaseIdentity: Int,\n        val createdAtElapsedMs: Long,\n        val idsByPath: Map<String, Long>,\n        val ambiguousPaths: Set<String>\n    )\n'''
          if membership not in c:
              raise SystemExit("PlaylistBridgeController Membership block missing")
          c = c.replace(membership, index_data, 1)
          cache_field = '''    private val cache = ConcurrentHashMap<String, Membership>()\n'''
          cache_new = cache_field + '''    @Volatile private var libraryPathIndex: LibraryPathIndex? = null\n'''
          if cache_field not in c:
              raise SystemExit("PlaylistBridgeController cache field missing")
          c = c.replace(cache_field, cache_new, 1)
          old_disable = '''        if (!value) {\n            cache.clear()\n            nativeSmartChooserContinuation = null\n'''
          new_disable = '''        if (!value) {\n            cache.clear()\n            libraryPathIndex = null\n            nativeSmartChooserContinuation = null\n'''
          if old_disable not in c:
              raise SystemExit("PlaylistBridgeController disable block missing")
          c = c.replace(old_disable, new_disable, 1)

          old_label = '''    fun rewriteNativeSmartPlaylistRuleLabel(\n        rule: Any?,\n        original: String?\n    ): String? {\n        if (!enabled) return original\n        val native = bindings ?: return original\n        if (rule == null || !native.smartRuleClass.isInstance(rule)) {\n            return original\n        }\n        val value = runCatching {\n            native.ruleValue.get(rule) as? String\n        }.getOrNull()\n        if (PlaylistBridgeReference.isBridgeValue(value)) return original\n        if (\n            !PlaylistBridgePolicy\n                .isNativeSmartPlaylistReference(value)\n        ) {\n            return original\n        }\n        val display = value\n            ?.substringAfter('|', "")\n            ?.takeUnless(String::isBlank)\n            ?: return original\n        val context = contextRef?.get() ?: return original\n        return NativeGmmpUiText.smartPlaylist(context) + ": " + display\n    }\n'''
          new_label = '''    fun rewriteNativeSmartPlaylistRuleLabel(\n        rule: Any?,\n        original: String?\n    ): String? {\n        if (!enabled || rule == null) return original\n        val native = bindings ?: return original\n        val value = runCatching {\n            if (native.ruleValue.declaringClass.isInstance(rule)) {\n                native.ruleValue.get(rule) as? String\n            } else {\n                null\n            }\n        }.getOrNull()\n        val context = contextRef?.get() ?: return original\n        val playlistLabel = NativeGmmpUiText.string(context, "playlist") ?: "Playlist"\n        val smartPlaylistLabel = NativeGmmpUiText.smartPlaylist(context)\n        val bridgeDisplay = PlaylistBridgeReference.decode(value)?.displayName\n        val nativeSmartDisplay = value\n            ?.takeIf(PlaylistBridgePolicy::isNativeSmartPlaylistReference)\n            ?.substringAfter('|', "")\n            ?.substringBefore('|')\n            ?.takeUnless(String::isBlank)\n        return PlaylistBridgeRuleLabelPolicy.rewrite(\n            original = original,\n            playlistLabel = playlistLabel,\n            smartPlaylistLabel = smartPlaylistLabel,\n            bridgeDisplayName = bridgeDisplay,\n            nativeSmartDisplayName = nativeSmartDisplay\n        )\n    }\n'''
          if old_label not in c:
              raise SystemExit("PlaylistBridgeController label function missing")
          c = c.replace(old_label, new_label, 1)

          old_resolve = '''    private fun resolveTrackIds(\n        native: Bindings,\n        paths: List<String>\n    ): List<Long> {\n        val database = native.databaseSingleton.get(null)\n            ?: throw IllegalStateException("GMDatabase singleton is null")\n        val result = linkedSetOf<Long>()\n        paths.distinct().chunked(MAX_IN_VALUES).forEach { chunk ->\n            val placeholders = chunk.joinToString(",") { "?" }\n            val args = Array<Any?>(chunk.size) { index -> chunk[index] }\n            val ids = GmmpReadOnlySql.queryDatabase(\n                databaseInstance = database,\n                sql = "SELECT song_id FROM tracks WHERE track_uri IN (" +\n                    placeholders + ")",\n                args = args\n            ) { cursor ->\n                val idColumn = cursor.getColumnIndex("song_id")\n                require(idColumn >= 0) {\n                    "GMMP track-id query did not expose song_id"\n                }\n                buildList {\n                    while (cursor.moveToNext()) add(cursor.getLong(idColumn))\n                }\n            }\n            result.addAll(ids)\n        }\n        Log.i(\n            TAG,\n            "BRIDGE SOURCE IDS | paths=${paths.size} | library=${result.size}"\n        )\n        return result.toList()\n    }\n'''
          new_resolve = '''    private fun resolveTrackIds(\n        native: Bindings,\n        paths: List<String>\n    ): List<Long> {\n        if (paths.isEmpty()) return emptyList()\n        val database = native.databaseSingleton.get(null)\n            ?: throw IllegalStateException("GMDatabase singleton is null")\n        val databaseIdentity = System.identityHashCode(database)\n        val now = SystemClock.elapsedRealtime()\n        val cached = libraryPathIndex?.takeIf { index ->\n            index.databaseIdentity == databaseIdentity &&\n                now - index.createdAtElapsedMs <= LIBRARY_PATH_INDEX_MAX_AGE_MS\n        }\n        val index = cached ?: GmmpReadOnlySql.queryDatabase(\n            databaseInstance = database,\n            sql = "SELECT song_id, track_uri FROM tracks WHERE track_placeholder = 0"\n        ) { cursor ->\n            val idColumn = cursor.getColumnIndex("song_id")\n            val pathColumn = cursor.getColumnIndex("track_uri")\n            require(idColumn >= 0 && pathColumn >= 0) {\n                "GMMP track path index did not expose song_id/track_uri"\n            }\n            val idsByPath = linkedMapOf<String, Long>()\n            val ambiguous = linkedSetOf<String>()\n            while (cursor.moveToNext()) {\n                if (cursor.isNull(pathColumn)) continue\n                val trackId = cursor.getLong(idColumn)\n                trackPathKeys(cursor.getString(pathColumn)).forEach { key ->\n                    if (key in ambiguous) return@forEach\n                    val previous = idsByPath[key]\n                    if (previous == null || previous == trackId) {\n                        idsByPath[key] = trackId\n                    } else {\n                        idsByPath.remove(key)\n                        ambiguous += key\n                    }\n                }\n            }\n            LibraryPathIndex(\n                databaseIdentity = databaseIdentity,\n                createdAtElapsedMs = SystemClock.elapsedRealtime(),\n                idsByPath = idsByPath,\n                ambiguousPaths = ambiguous\n            )\n        }.also { loaded ->\n            libraryPathIndex = loaded\n            Log.i(\n                TAG,\n                "BRIDGE LIBRARY INDEX | paths=${loaded.idsByPath.size} | " +\n                    "ambiguous=${loaded.ambiguousPaths.size}"\n            )\n        }\n\n        val result = linkedSetOf<Long>()\n        var ambiguousSources = 0\n        paths.distinct().forEach { sourcePath ->\n            val keys = trackPathKeys(sourcePath)\n            if (keys.any { it in index.ambiguousPaths }) {\n                ambiguousSources++\n                return@forEach\n            }\n            keys.firstNotNullOfOrNull { index.idsByPath[it] }?.let(result::add)\n        }\n        Log.i(\n            TAG,\n            "BRIDGE SOURCE IDS | paths=${paths.size} | library=${result.size} | " +\n                "index=${index.idsByPath.size} | ambiguous=$ambiguousSources | " +\n                "cache=${cached != null}"\n        )\n        return result.toList()\n    }\n\n    private fun trackPathKeys(path: String?): List<String> {\n        val raw = path?.trim()?.takeUnless(String::isBlank) ?: return emptyList()\n        val filePath = if (raw.startsWith("file://", ignoreCase = true)) {\n            raw.substring(7)\n        } else {\n            raw\n        }\n        return buildList {\n            add(raw)\n            if (filePath != raw) add(filePath)\n            if (!filePath.contains("://")) {\n                add(canonicalPath(File(filePath)))\n            }\n        }.filter(String::isNotBlank).distinct()\n    }\n'''
          if old_resolve not in c:
              raise SystemExit("PlaylistBridgeController resolveTrackIds block missing")
          c = c.replace(old_resolve, new_resolve, 1)
          controller.write_text(c)

          Path("app/src/main/java/io/github/alagga/gonesmart/PlaylistBridgeRuleLabelPolicy.kt").write_text(r'''package io.github.alagga.gonesmart

internal object PlaylistBridgeRuleLabelPolicy {
    fun rewrite(
        original: String?,
        playlistLabel: String,
        smartPlaylistLabel: String,
        bridgeDisplayName: String?,
        nativeSmartDisplayName: String?
    ): String? {
        bridgeDisplayName?.takeUnless(String::isBlank)?.let {
            return "$playlistLabel: $it"
        }
        nativeSmartDisplayName?.takeUnless(String::isBlank)?.let {
            return "$smartPlaylistLabel: $it"
        }
        val text = original ?: return null
        val prefix = "$playlistLabel:"
        if (text.startsWith(prefix, ignoreCase = true)) {
            val suffix = text.substring(prefix.length).trimStart()
            if (suffix.isNotBlank()) return "$smartPlaylistLabel: $suffix"
        }
        return original
    }
}
''')

          Path("app/src/test/java/io/github/alagga/gonesmart/PlaylistBridgeRuleLabelPolicyTest.kt").write_text(r'''package io.github.alagga.gonesmart

