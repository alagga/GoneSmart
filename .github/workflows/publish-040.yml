name: Publish GoneSmart 0.4.0

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-off publisher from release tree
        id: clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/publish-040.yml
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): remove one-off 0.4.0 publisher'
          git push origin HEAD:main
          CLEAN_SHA=$(git rev-parse HEAD)
          echo "sha=$CLEAN_SHA" >> "$GITHUB_OUTPUT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CLEAN_SHA"

      - name: Run normal Build on clean main
        id: build
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_SHA='${{ steps.clean.outputs.sha }}'
          gh workflow run build.yml --ref main

          RUN_ID=''
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --workflow build.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$CLEAN_SHA\") | .databaseId" \
              | head -n1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not find dispatched clean-main Build run'; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$CLEAN_SHA"

      - name: Publish signed v0.4.0 release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_SHA='${{ steps.clean.outputs.sha }}'
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            echo 'v0.4.0 already exists; refusing to overwrite it'
            exit 1
          fi

          gh workflow run release.yml --ref main -f prerelease=false

          RUN_ID=''
          for attempt in $(seq 1 60); do
            RUN_ID=$(gh run list \
              --workflow release.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$CLEAN_SHA\") | .databaseId" \
              | head -n1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done
          test -n "$RUN_ID" || { echo 'Could not find dispatched release run'; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          gh run watch "$RUN_ID" --exit-status

          git fetch origin tag v0.4.0
          test "$(git rev-list -n1 v0.4.0)" = "$CLEAN_SHA" || {
            echo 'v0.4.0 does not point to the clean validated main commit'
            exit 1
          }
          test "$(gh release view v0.4.0 --json isPrerelease --jq '.isPrerelease')" = 'false'
          gh release view v0.4.0 --json assets --jq '.assets[].name' | grep -Fx 'GoneSmart-v0.4.0.apk'
