name: Source snapshot temp

on:
  push:
    branches:
      - fix/playlist-link-gmmp-4.2.1

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: GoneSmart-source-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
